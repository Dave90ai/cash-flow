<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#000000">

    <title>Cash Flow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">

        <div class="account-name">
            Checking
        </div>

        <button
            class="menu-button"
            id="menuButton">
            •••
        </button>

        <div
            class="theme-menu"
            id="themeMenu">

            <button data-theme="dark">
                Dark
            </button>

            <button data-theme="light">
                Light
            </button>

        </div>

    </header>


    <section class="balance-section">

        <div
            class="balance"
            id="currentBalance">
            0
        </div>

        <div class="balance-label">
            current balance
        </div>

    </section>


    <section class="graph-card">

        <div class="graph">

            <div class="graph-scale">

                <span
                    class="scale-value scale-top"
                    id="scaleTop">
                    20k
                </span>

                <span
                    class="scale-value scale-middle"
                    id="scaleMiddle">
                    10k
                </span>

                <span
                    class="scale-value scale-zero">
                    0
                </span>

                <span
                    class="scale-value scale-negative"
                    id="scaleNegative">
                    −10k
                </span>

            </div>

            <div class="graph-area">

                <div class="zero-line"></div>

                <svg
                    id="balanceGraph"
                    viewBox="0 0 700 190"
                    preserveAspectRatio="none">

                    <path
                        id="positiveGraph"
                        fill="none"
                        stroke="#45d483"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round">
                    </path>

                    <path
                        id="negativeGraph"
                        fill="none"
                        stroke="#ff453a"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round">
                    </path>

                </svg>

            </div>

        </div>

        <div
            class="graph-dates"
            id="graphDates">
        </div>

    </section>


    <section
        class="transactions"
        id="transactionList">
    </section>

</div>


<button
    class="add-button"
    id="addButton">
    +
</button>


<!-- ADD / EDIT TRANSACTION -->

<div
    class="modal"
    id="transactionModal">

    <div class="form-card">

        <div class="drag-bar"></div>

        <div class="form-header">

            <div
                class="form-title"
                id="formTitle">
                Add Transaction
            </div>

            <button
                class="close-button"
                id="closeButton">
                ×
            </button>

        </div>


        <div class="field">

            <label class="field-label">
                Date
            </label>

            <input
                id="dateInput"
                class="date-input"
                type="date">

        </div>


        <div class="field">

            <label class="field-label">
                Amount
            </label>

            <div class="amount-row">

                <button
                    id="minusButton"
                    class="sign-button selected">
                    −
                </button>

                <button
                    id="plusButton"
                    class="sign-button">
                    +
                </button>

                <input
                    id="amountInput"
                    class="amount-input placeholder"
                    type="text"
                    inputmode="decimal"
                    autocomplete="off"
                    placeholder="−0">

            </div>

            <div
                class="amount-hint"
                id="amountHint">
                Debit selected
            </div>

        </div>


        <div class="field">

            <label
                class="field-label"
                for="commentInput">
                Comment
            </label>

            <input
                id="commentInput"
                class="text-input"
                type="text"
                autocomplete="off"
                placeholder="Optional">

            <div
                class="suggestions"
                id="commentSuggestions">
            </div>

        </div>


        <div class="field">

            <label
                class="field-label"
                for="categoryInput">
                Category
            </label>

            <input
                id="categoryInput"
                class="text-input"
                type="text"
                autocomplete="off"
                placeholder="Optional">

            <div
                class="suggestions"
                id="categorySuggestions">
            </div>

        </div>


        <div class="form-actions">

            <button
                class="cancel-button"
                id="cancelButton">
                Cancel
            </button>

            <button
                class="save-button"
                id="saveButton">
                Save
            </button>

        </div>


        <button
            id="deleteEditButton"
            class="delete-edit-button">
            Delete transaction
        </button>

    </div>

</div>


<script src="app.js"></script>
<script src="accounts.js"></script>

</body>
</html>
