<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">

    <title>Cash Flow</title>

    <style>

        :root {
            --bg: #000000;
            --card: #171717;
            --field: #222222;
            --text: #f5f5f7;
            --secondary: #a1a1a6;
            --border: #303030;

            --button: #f5f5f7;
            --button-text: #000000;

            --green: #45d483;
            --red: #ff453a;
            --zero: #66666b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

            background: var(--bg);
            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                Helvetica,
                Arial,

           APP

                max(28px, env(safe-area-inset-bottom));
        }


        /* =========================
           HEADER
           ========================= */

        .header {
            position: relative;

            display: flex;
            align-items: center;

        }

        }

        .menu-button {
            width: 38px;
            height: 38px;

        }

           BALANCE
           ========================= */

        .balance-section {

        /* =========================
           GRAPH
           ========================= */

        .graph-card {
            margin-top: 9px;

            border-radius: 17px;

        }

        .graph {
            position: relative;

            grid-template-columns: 46px 1fr;
        }

        .graph-scale {
            position: relative;

            height: 100%;

            color: var(--secondary);

            font-size: 10px;
        }

        .scale-value {
            position: absolute;

            right: 6px;

            transform: translateY(-50%);
        }

        .scale-top {
            top: 10%;
        }

        .scale-middle {
            top: 35%;
        }

        .scale-zero {
            top: 60%;

            font-weight: 600;
        }

        .scale-negative {
            top: 84%;

            color: var(--red);
        }

        .graph-area {
            position: relative;

            height: 100%;
        }

        .zero-line {
            position: absolute;

            left: 0;
            right: 0;

            top: 60%;

            border-top: 1px dashed var(--zero);

            z-index: 1;
        }

        .graph svg {
            width: 100%;
            height: 100%;

            display: block;

            overflow: visible;
        }

        .graph-dates {
            margin-left: 50px;

            display: flex;
            justify-content: space-between;

            color: var(--secondary);

            font-size: 10px;

            padding: 5px 1px 0;
        }


        /* =========================
           TRANSACTIONS
           ========================= */

        .transactions {
            margin-top: 17px;
        }

        .transaction {
            display: grid;

            grid-template-columns:
                45px
                minmax(0, 1fr)

            padding: 3px 0;

        .transaction-date {

            font-size: 15px;

            font-weight: 700;
        }

        .transaction-amount {
            font-size: 15px;

            font-weight: 700;

            white-space: nowrap;
        }

        .transaction-balance {
            min-width: 72px;

            text-align: right;

            font-size: 15px;

            font-weight: 700;

            white-space: nowrap;
        }

        .credit {
            color: var(--green);
        }

        .debit,
        .negative-balance {
            color: var(--red);
        }


        /* =========================
           ADD BUTTON
           ========================= */

        .add-button {
            position: fixed;

            right:
                max(
                    20px,
                    calc((100vw - 760px) / 2 + 20px)

            border: 0;

            border-radius: 50%;

            font-size: 31px;

            font-weight: 300;

            line-height: 1;

            box-shadow:
                0 5px 18px rgba(0,0,0,.35);

            cursor: pointer;
        }

        .add-button:active {
            transform: scale(.95);
        }


        /* =========================
           MODAL
           ========================= */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.72);

            z-index: 100;

            align-items: flex-end;

            justify-content: center;
        }

        .modal.open {
            display: flex;
        }

        .form-card {
            width: 100%;

            max-width: 760px;

            background: var(--card);

            border-radius:
                20px
                20px
                0
                0;

            padding:
                10px
                16px
                max(
                    16px,
                    env(safe-area-inset-bottom)
                );

            max-height: 90vh;

            overflow-y: auto;
        }

        .drag-bar {
            width: 38px;
            height: 4px;

            border-radius: 5px;

            background: #555;

            margin:
                0 auto
                10px;
        }

        .form-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 12px;
        }

        .form-title {
            font-size: 21px;

            font-weight: 700;
        }

        .close-button {
            border: 0;

            background: transparent;

            color: var(--secondary);

            font-size: 24px;

            cursor: pointer;
        }


        /* =========================
           FORM FIELDS
           ========================= */

        .field {
            margin-bottom: 11px;
        }

        .field-label {
            display: block;

            margin-bottom: 4px;

            font-size: 11px;
        }

        .date-input,
        .text-input {
            width: 100%;

            padding:
                0 11px;

            outline: none;
        }


        /* =========================
           AMOUNT
           ========================= */

        .amount-row {
            display: grid;

            gap: 6px;

            align-items: center;
        }

        .sign-button {
            height: 46px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background: var(--field);

            font-size: 21px;

        }

            border-color: var(--button);
        }

        .amount-input {

        }

        }

           ACTIONS
           ========================= */

        .form-actions {
            display: grid;

            grid-template-columns:
                1fr
                1.4fr;

            gap: 8px;

            margin-top: 14px;
        }

        .cancel-button,
        .save-button {
            height: 46px;

            border-radius: 12px;

            border: 0;

        .cancel-button {
            background: #292929;

        }

            background: var(--button);

        .theme-menu {

        }

        .theme-menu button {
            display: block;

                9px 12px;

            font-size: 14px;
        }

        .theme-menu button:hover {

        }


        /* =========================
           LIGHT THEME
           ========================= */

        body.light {
            --bg: #f5f5f7;

            --card: #ffffff;

            --field: #f0f0f2;

            --text: #1d1d1f;

            --secondary: #77777c;

        /* =========================

        @media (min-width: 760px) {

            .app {

            }

            }
        }

    </style>
</head>


<body>

<div
    class="modal"
    id="transactionModal">


    <div class="form-card">


        <div class="drag-bar"></div>


        <div class="form-header">

            <div class="form-title">
                Add Transaction
            </div>

            <button
                class="close-button"
                onclick="closeAddTransaction()">

                ×

            </button>

        </div>


        <!-- DATE -->

        <div class="field">

            <label
                class="field-label"
                for="dateInput">

                Date

            </label>


            <input
                id="dateInput"
                class="date-input"
                type="date">

        </div>


        <!-- AMOUNT -->

        <div class="field">

            <label
                class="field-label">

                Amount

            </label>


            <div class="amount-row">


                <!-- DEBIT -->

                <button
                    id="minusButton"
                    class="sign-button selected"
                    onclick="setSign(-1)"
                    aria-label="Debit">

                    −

                </button>


                <!-- CREDIT -->

                <button
                    id="plusButton"
                    class="sign-button"
                    onclick="setSign(1)"
                    aria-label="Credit">

                    +

                </button>


                <input
                    id="amountInput"
                    class="amount-input"
                    type="text"
                    inputmode="decimal"
                    autocomplete="off"
                    value="0">

            </div>


            <div class="amount-hint">
                Debit is selected by default
            </div>

        </div>


        <!-- CATEGORY -->

        <div class="field">

            <label
                class="field-label"
                for="categoryInput">

                Category

            </label>


            <input
                id="categoryInput"
                class="text-input"
                type="text"
                autocomplete="off"
                placeholder="Optional">


            <div
                class="suggestions"
                id="categorySuggestions">

            </div>

        </div>


        <!-- COMMENT -->

        <div class="field">

            <label
                class="field-label"
                for="commentInput">

                Comment

            </label>


            <input
                id="commentInput"
                class="text-input"
                type="text"
                autocomplete="off"
                placeholder="Optional">


            <div
                class="suggestions"
                id="commentSuggestions">

            </div>

        </div>

        <div class="form-actions">

            <button
                class="cancel-button"
                onclick="closeAddTransaction()">

                Cancel

            </button>


            <button
                class="save-button"
                id="saveButton"
                onclick="addTransaction()">

                Add

            </button>

</div>



<script>


    /* =========================
       DATA
       ========================= */

    let transactions = [

        {
            date: "2026-09-29",
            amount: -12000,
            category: "",
            comment: "Large payment"
        },

        {
            date: "2026-09-02",
            amount: 8000,
            category: "Salary",
            comment: "Monthly salary"
        },

        {
            date: "2026-08-20",
            amount: -1200,
            category: "Credit Card",
            comment: "Credit card"
        },

        {
            date: "2026-08-20",
            amount: -3500,
            category: "Rent",
            comment: "Rent"
        },

        {
            date: "2026-08-15",
            amount: 8000,
            category: "Salary",
            comment: "Monthly salary"
        },

        {
            date: "2026-08-12",
            amount: -450,
            category: "Utilities",
            comment: "Electricity"
        },

        {
            date: "2026-08-10",
            amount: -350,
            category: "Food",
            comment: "Supermarket"
        },

        {
            date: "2026-08-10",
            amount: 8000,
            category: "Salary",
            comment: "Monthly salary"
        }

    ];


    /* =========================
       SIGN
       ========================= */

    let transactionSign = -1;


    /* =========================
       DEBIT LISTS
       ========================= */

    const debitCategories = [

        "Credit Card",
        "Rent",
        "Electricity",
        "Food",
        "Insurance",
        "Tax",
        "Utilities",
        "Other"

    ];


    const debitComments = [

        "Credit card estimate",
        "Rent",
        "Electricity bill",
        "Supermarket",
        "Insurance",
        "Tax payment",
        "Monthly expenses",
        "Other"

    ];


    /* =========================
       CREDIT LISTS
       ========================= */

    const creditCategories = [

        "Salary",
        "Refund",
        "Interest",
        "Transfer",
        "Bonus",
        "Other"

    ];


    const creditComments = [

        "Monthly salary",
        "Refund",
        "Interest",
        "Transfer",
        "Bonus",
        "Other"

    ];


    /* =========================
       SET SIGN
       ========================= */

    function setSign(sign) {

        transactionSign = sign;


        const minus =
            document.getElementById(
                "minusButton"
            );

        const plus =
            document.getElementById(
                "plusButton"
            );


        if (sign === -1) {

            minus.classList.add(
                "selected"
            );

            plus.classList.remove(
                "selected"
            );

        } else {

            plus.classList.add(
                "selected"
            );

            minus.classList.remove(
                "selected"
            );

        }


        updateAmountDisplay();


        renderSuggestions();

    }


    /* =========================
       AMOUNT
       ========================= */

    function updateAmountDisplay() {

        const input =
            document.getElementById(
                "amountInput"
            );


        let value =
            input.value
                .replace(/[^\d.]/g, "");


        if (value === "") {
            value = "0";
        }


        /*
         * We keep the sign visually
         * represented by the buttons.
         */

        input.value = value;

    }


    /* =========================
       SUGGESTIONS
       ========================= */

    function renderSuggestions() {

        const categoryBox =
            document.getElementById(
                "categorySuggestions"
            );

        const commentBox =
            document.getElementById(
                "commentSuggestions"
            );


        const categories =
            transactionSign === -1
                ? debitCategories
                : creditCategories;


        const comments =
            transactionSign === -1
                ? debitComments
                : creditComments;


        categoryBox.innerHTML = "";


        categories.forEach(
            category => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "suggestion";

                button.textContent =
                    category;

                button.onclick =
                    () => chooseCategory(
                        category
                    );

                categoryBox.appendChild(
                    button
                );

            }
        );


        commentBox.innerHTML = "";


        comments.forEach(
            comment => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "suggestion";

                button.textContent =
                    comment;

                button.onclick =
                    () => chooseComment(
                        comment
                    );

                commentBox.appendChild(
                    button
                );

            }
        );

    }


    function chooseCategory(value) {

        document.getElementById(
            "categoryInput"
        ).value = value;

    }


    function chooseComment(value) {

        document.getElementById(
            "commentInput"
        ).value = value;

    }


    /* =========================
       ADD TRANSACTION
       ========================= */

    function openAddTransaction() {

        const modal =
            document.getElementById(
                "transactionModal"
            );


        const date =
            document.getElementById(
                "dateInput"
            );


        const amount =
            document.getElementById(
                "amountInput"
            );


        const today =
            new Date()
                .toISOString()
                .split("T")[0];


        date.value = today;


        /*
         * Every new transaction starts
         * as a debit.
         */

        transactionSign = -1;


        document.getElementById(
            "minusButton"
        ).classList.add(
            "selected"
        );


        document.getElementById(
            "plusButton"
        ).classList.remove(
            "selected"
        );


        amount.value = "0";


        document.getElementById(
            "categoryInput"
        ).value = "";


        document.getElementById(
            "commentInput"
        ).value = "";


        renderSuggestions();


        modal.classList.add(
            "open"
        );


        setTimeout(
            () => amount.focus(),
            150
        );

    }


    function closeAddTransaction() {

        document
            .getElementById(
                "transactionModal"
            )
            .classList.remove(
                "open"
            );

    }


    function addTransaction() {

        const date =
            document.getElementById(
                "dateInput"
            ).value;


        const amountInput =
            document.getElementById(
                "amountInput"
            );


        const amountValue =
            Number(
                amountInput.value
                    .replace(/,/g, "")
            );


        const category =
            document.getElementById(
                "categoryInput"
            ).value.trim();


        const comment =
            document.getElementById(
                "commentInput"
            ).value.trim();


        if (!date) {
            return;
        }


        if (
            !Number.isFinite(
                amountValue
            ) ||
            amountValue <= 0
        ) {

            amountInput.focus();

            return;

        }


        transactions.push({

            date: date,

            amount:
                amountValue *
                transactionSign,

            category: category,

            comment: comment

        });


        renderTransactions();


        closeAddTransaction();

    }


    /* =========================
       CALCULATE BALANCES
       ========================= */

    function calculateBalances() {

        const sorted =
            [...transactions].sort(
                (a, b) =>
                    a.date.localeCompare(
                        b.date
                    )
            );


        let balance = 0;


        for (
            const transaction
            of sorted
        ) {

            balance +=
                transaction.amount;

            transaction.balance =
                balance;

        }


        return sorted;

    }


    /* =========================
       FORMAT
       ========================= */

    function formatAmount(value) {

        const absolute =
            Math.abs(value)
                .toLocaleString(
                    "en-US"
                );


        if (value < 0) {

            return "−" + absolute;

        }


        return "+" + absolute;

    }


    function formatBalance(value) {

        const absolute =
            Math.abs(value)
                .toLocaleString(
                    "en-US"
                );


        if (value < 0) {

            return "−" + absolute;

        }


        return absolute;

    }


    function formatDate(dateString) {

        const parts =
            dateString.split("-");


        return (
            parts[2] +
            "/" +
            parts[1]
        );

    }


    /* =========================
       TRANSACTIONS DISPLAY
       ========================= */

    function renderTransactions() {

        const list =
            document.getElementById(
                "transactionList"
            );


        list.innerHTML = "";


        const sorted =
            calculateBalances();


        /*
         * Newest first.
         */

        sorted.reverse();


        sorted.forEach(
            transaction => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "transaction";


                const amountClass =
                    transaction.amount < 0
                        ? "transaction-amount debit"
                        : "transaction-amount credit";


                const balanceClass =
                    transaction.balance < 0
                        ? "transaction-balance negative-balance"
                        : "transaction-balance";


                row.innerHTML = `

                    <div class="transaction-date">
                        ${formatDate(
                            transaction.date
                        )}
                    </div>

                    <div class="transaction-comment">
                        ${escapeHtml(
                            transaction.comment || ""
                        )}
                    </div>

                    <div class="${amountClass}">
                        ${formatAmount(
                            transaction.amount
                        )}
                    </div>

                    <div class="${balanceClass}">
                        ${formatBalance(
                            transaction.balance
                        )}
                    </div>

                `;


                list.appendChild(row);

            }
        );


        if (sorted.length > 0) {

            const current =
                sorted[0].balance;


            const balanceElement =
                document.getElementById(
                    "currentBalance"
                );


            balanceElement.textContent =
                formatBalance(
                    current
                );


            if (current < 0) {

                balanceElement.classList.add(
                    "negative"
                );

            } else {

                balanceElement.classList.remove(
                    "negative"
                );

            }

        }

    }


    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            text;


        return div.innerHTML;

    }


    /* =========================
       THEME
       ========================= */

    function toggleThemeMenu() {

        const menu =
            document.getElementById(
                "themeMenu"
            );


        menu.style.display =
            menu.style.display === "block"
                ? "none"
                : "block";

    }


    function setTheme(theme) {

        if (
            theme === "light"
        ) {

            document.body.classList.add(
                "light"
            );


            localStorage.setItem(
                "cashFlowTheme",
                "light"
            );

        } else {

            document.body.classList.remove(
                "light"
            );


            localStorage.setItem(
                "cashFlowTheme",
                "dark"
            );

        }


        document.getElementById(
            "themeMenu"
        ).style.display =
            "none";

    }


    /* =========================
       INITIALIZE
       ========================= */

    const savedTheme =
        localStorage.getItem(
            "cashFlowTheme"
        );


    if (
        savedTheme === "light"
    ) {

        document.body.classList.add(
            "light"
        );

    }


    renderSuggestions();

    renderTransactions();


</script>

</body>
</html>
