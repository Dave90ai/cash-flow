<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Cash Flow</title>

    <style>
        :root {
            --bg: #000000;
            --card: #171717;
            --field: #222222;
            --text: #f5f5f7;
            --secondary: #a1a1a6;
            --border: #303030;
            --button: #f5f5f7;
            --button-text: #000000;
            --green: #45d483;
            --red: #ff453a;
            --zero: #66666b;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont,
                         "SF Pro Display", "SF Pro Text",
                         Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding:
                max(18px, env(safe-area-inset-top))
                16px
                max(28px, env(safe-area-inset-bottom));
        }

        /* =========================
           HEADER
           ========================= */

        .header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .account-name {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .menu-button {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: #242424;
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
        }

        /* =========================
           BALANCE
           ========================= */

        .balance-section {
            text-align: center;
            padding: 8px 0 7px;
        }

        .balance {
            font-size: 39px;
            line-height: 1.05;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .balance.negative {
            color: var(--red);
        }

        .balance-label {
            margin-top: 4px;
            color: var(--secondary);
            font-size: 12px;
        }

        /* =========================
           GRAPH
           ========================= */

        .graph-card {
            margin-top: 9px;
            background: var(--card);
            border-radius: 17px;
            padding: 12px 10px 8px 4px;
        }

        .graph {
            position: relative;
            height: 190px;
            display: grid;
            grid-template-columns: 46px 1fr;
        }

        .graph-scale {
            position: relative;
            height: 100%;
            color: var(--secondary);
            font-size: 10px;
        }

        .scale-value {
            position: absolute;
            right: 6px;
            transform: translateY(-50%);
        }

        .scale-top {
            top: 10%;
        }

        .scale-middle {
            top: 35%;
        }

        .scale-zero {
            top: 60%;
            color: var(--text);
            font-weight: 600;
        }

        .scale-negative {
            top: 84%;
            color: var(--red);
        }

        .graph-area {
            position: relative;
            height: 100%;
        }

        .zero-line {
            position: absolute;
            left: 0;
            right: 0;
            top: 60%;
            border-top: 1px dashed var(--zero);
            z-index: 1;
        }

        .graph svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .graph-dates {
            margin-left: 50px;
            display: flex;
            justify-content: space-between;
            color: var(--secondary);
            font-size: 10px;
            padding: 5px 1px 0;
        }

        /* =========================
           TRANSACTIONS
           ========================= */

        .transactions {
            margin-top: 17px;
        }

        .transaction {
            display: grid;
            grid-template-columns: 45px minmax(0, 1fr) auto auto;
            gap: 7px;
            align-items: center;

            min-height: 31px;
            padding: 3px 0;

            border-bottom: 1px solid var(--border);
        }

        .transaction-date {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
        }

        .transaction-comment {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 700;
        }

        .transaction-amount {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
        }

        .transaction-balance {
            min-width: 72px;
            text-align: right;
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
        }

        .credit {
            color: var(--green);
        }

        .debit,
        .negative-balance {
            color: var(--red);
        }

        /* =========================
           ADD BUTTON
           ========================= */

        .add-button {
            position: fixed;
            right: max(20px, calc((100vw - 760px) / 2 + 20px));
            bottom: max(22px, env(safe-area-inset-bottom));

            width: 57px;
            height: 57px;

            border: 0;
            border-radius: 50%;

            background: var(--button);
            color: var(--button-text);

            font-size: 31px;
            font-weight: 300;
            line-height: 1;

            box-shadow: 0 5px 18px rgba(0,0,0,.35);
            cursor: pointer;
        }

        /* =========================
           MODAL
           ========================= */

        .modal {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,.72);

            z-index: 100;

            align-items: flex-end;
            justify-content: center;
        }

        .modal.open {
            display: flex;
        }

        .form-card {
            width: 100%;
            max-width: 760px;

            background: var(--card);

            border-radius: 22px 22px 0 0;

            padding:
                14px
                18px
                max(22px, env(safe-area-inset-bottom));

            max-height: 92vh;
            overflow-y: auto;
        }

        .drag-bar {
            width: 42px;
            height: 5px;
            border-radius: 5px;
            background: #555;
            margin: 0 auto 16px;
        }

        .form-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .form-title {
            font-size: 23px;
            font-weight: 700;
        }

        .close-button {
            border: 0;
            background: transparent;
            color: var(--secondary);
            font-size: 25px;
            cursor: pointer;
        }

        /* =========================
           FORM FIELDS
           ========================= */

        .field {
            margin-bottom: 17px;
        }

        .field-label {
            display: block;
            margin-bottom: 6px;
            color: var(--secondary);
            font-size: 12px;
        }

        .date-input,
        .amount-input,
        .text-input,
        .select-input {
            width: 100%;
            height: 50px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--field);
            color: var(--text);

            padding: 0 14px;

            font-size: 17px;
            outline: none;
        }

        .date-input:focus,
        .amount-input:focus,
        .text-input:focus {
            border-color: #777;
        }

        .amount-input {
            height: 62px;
            font-size: 28px;
            font-weight: 700;
            text-align: right;
        }

        .amount-hint {
            margin-top: 5px;
            color: var(--secondary);
            font-size: 11px;
        }

        /* =========================
           SUGGESTIONS
           ========================= */

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 8px;
        }

        .suggestion {
            border: 1px solid var(--border);
            border-radius: 20px;
            background: transparent;
            color: var(--secondary);

            padding: 7px 11px;

            font-size: 12px;
            cursor: pointer;
        }

        .suggestion:active {
            background: #303030;
            color: var(--text);
        }

        /* =========================
           FORM ACTIONS
           ========================= */

        .form-actions {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 10px;
            margin-top: 23px;
        }

        .cancel-button,
        .save-button {
            height: 52px;
            border-radius: 14px;
            border: 0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .cancel-button {
            background: #292929;
            color: var(--text);
        }

        .save-button {
            background: var(--button);
            color: var(--button-text);
        }

        .save-button:disabled {
            opacity: .35;
            cursor: default;
        }

        /* =========================
           THEME MENU
           ========================= */

        .theme-menu {
            display: none;

            position: absolute;
            top: 45px;
            right: 0;

            background: #202020;
            border: 1px solid #353535;
            border-radius: 12px;

            padding: 6px;

            z-index: 10;
        }

        .theme-menu button {
            display: block;

            width: 120px;

            padding: 9px 12px;

            border: 0;
            border-radius: 8px;

            background: transparent;
            color: white;

            text-align: left;
            font-size: 14px;
        }

        .theme-menu button:hover {
            background: #303030;
        }

        /* =========================
           LIGHT THEME
           ========================= */

        body.light {
            --bg: #f5f5f7;
            --card: #ffffff;
            --field: #f0f0f2;
            --text: #1d1d1f;
            --secondary: #77777c;
            --border: #dedee2;
            --button: #111111;
            --button-text: #ffffff;
            --green: #16834a;
            --red: #d93025;
            --zero: #b0b0b4;
        }

        body.light .menu-button {
            background: #e5e5e7;
            color: #1d1d1f;
        }

        body.light .cancel-button {
            background: #e5e5e7;
        }

        body.light .theme-menu {
            background: white;
            border-color: #ddd;
        }

        body.light .theme-menu button {
            color: #222;
        }

        body.light .theme-menu button:hover {
            background: #eee;
        }

        /* =========================
           DESKTOP
           ========================= */

        @media (min-width: 760px) {

            .app {
                padding-top: 32px;
            }

            .transaction {
                grid-template-columns: 55px minmax(0, 1fr) auto 95px;
                gap: 10px;
            }

            .transaction-comment,
            .transaction-amount,
            .transaction-balance {
                font-size: 16px;
            }

            .modal {
                align-items: center;
            }

            .form-card {
                border-radius: 20px;
                margin: 20px;
                max-height: 800px;
            }
        }

        /* =========================
           SMALL PHONES
           ========================= */

        @media (max-width: 380px) {

            .app {
                padding-left: 12px;
                padding-right: 12px;
            }

            .transaction {
                grid-template-columns: 42px minmax(0, 1fr) auto auto;
                gap: 5px;
            }

            .transaction-comment,
            .transaction-amount,
            .transaction-balance {
                font-size: 13px;
            }

            .transaction-balance {
                min-width: 62px;
            }

            .balance {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="account-name">Checking</div>

        <button class="menu-button"
                onclick="toggleThemeMenu()"
                aria-label="Settings">
            •••
        </button>

        <div class="theme-menu" id="themeMenu">
            <button onclick="setTheme('dark')">Dark</button>
            <button onclick="setTheme('light')">Light</button>
        </div>

    </header>

    <section class="balance-section">
        <div class="balance" id="currentBalance">−1,500</div>
        <div class="balance-label">current balance</div>
    </section>

    <!-- Graph prototype -->

    <section class="graph-card">

        <div class="graph">

            <div class="graph-scale">
                <span class="scale-value scale-top">20k</span>
                <span class="scale-value scale-middle">10k</span>
                <span class="scale-value scale-zero">0</span>
                <span class="scale-value scale-negative">−10k</span>
            </div>

            <div class="graph-area">

                <div class="zero-line"></div>

                <svg viewBox="0 0 700 190"

                    <path

                           L565,63"

                    <path

<!-- =========================

<div class="modal" id="transactionModal">

    <div class="form-card">

        <div class="drag-bar"></div>

        <div class="form-header">
            <div class="form-title">Add Transaction</div>

            <button class="close-button"
                    onclick="closeAddTransaction()">

        <!-- Date -->

        <div class="field">

        <div class="field">

            </div>

        <div class="field">

                        onclick="chooseCategory('Salary')">

                <button class="suggestion"

                </button>

        <div class="field">

            <label class="field-label" for="commentInput">

            </label>

                id="commentInput"

                autocomplete="off"
                placeholder="Optional">

            <div class="suggestions">

                <button class="suggestion"
                        onclick="chooseComment('Monthly salary')">
                    Monthly salary
                </button>

                <button class="suggestion"
                        onclick="chooseComment('Electricity bill')">
                    Electricity bill
                </button>

                <button class="suggestion"
                        onclick="chooseComment('Credit card estimate')">
                    Credit card estimate
                </button>

                        onclick="chooseComment('Rent')">
                    Rent
                </button>

        <div class="form-actions">

            <button class="cancel-button"
                    onclick="closeAddTransaction()">
                Cancel

                    id="saveButton"
                    onclick="addTransaction()"
                    disabled>
                Add
            </button>

    </div>

</div>


<script>

    /* =========================
       DEMO DATA
       ========================= */

    let transactions = [

        {
            date: "2026-09-29",
            amount: -12000,
            category: "",
            comment: "Large payment"
        },

        {
            date: "2026-09-02",
            amount: 8000,
            category: "Salary",
            comment: "Monthly salary"
        },

        {
            date: "2026-08-20",
            amount: -1200,
            category: "Credit Card",
            comment: "Credit card"
        },

        {
            date: "2026-08-20",
            amount: -3500,
            category: "Rent",
            comment: "Rent"
        },

        {
            date: "2026-08-15",
            amount: 8000,
            category: "Salary",
            comment: "Monthly salary"
        },

        {
            date: "2026-08-12",
            amount: -450,
            category: "Utilities",
            comment: "Electricity"
        },

        {
            date: "2026-08-10",
            amount: -350,
            category: "Food",
            comment: "Supermarket"
        },

        {
            date: "2026-08-10",
            amount: 8000,
            category: "Salary",
            comment: "Monthly salary"
        }

    ];


    /* =========================
       FORMATTERS
       ========================= */

    function formatAmount(value) {

        const absolute = Math.abs(value);

        const formatted = absolute.toLocaleString(
            "en-US",
            {
                maximumFractionDigits: 2
            }
        );

        if (value < 0) {
            return "−" + formatted;
        }

        return "+" + formatted;
    }


    function formatBalance(value) {

        const absolute = Math.abs(value);

        const formatted = absolute.toLocaleString(
            "en-US",
            {
                maximumFractionDigits: 2
            }
        );

        if (value < 0) {
            return "−" + formatted;
        }

        return formatted;
    }


    function formatDate(dateString) {

        const parts = dateString.split("-");

        return parts[2] + "/" + parts[1];

    }


    /* =========================
       CALCULATE BALANCES
       ========================= */

    function calculateBalances() {

        /*
         * Temporary demo calculation.
         *
         * Later this will be replaced by the
         * real adjustment/balance engine.
         */

        const sorted = [...transactions].sort(
            (a, b) => a.date.localeCompare(b.date)
        );

        let balance = 0;

        for (const transaction of sorted) {

            balance += transaction.amount;

            transaction.balance = balance;

        }

        return sorted;

    }


    /* =========================
       DISPLAY TRANSACTIONS
       ========================= */

    function renderTransactions() {

        const list =
            document.getElementById("transactionList");

        list.innerHTML = "";

        const sorted = calculateBalances();

        /*
         * Newest first.
         */

        sorted.reverse();

        for (const transaction of sorted) {

            const row =
                document.createElement("div");

            row.className = "transaction";

            const balanceClass =
                transaction.balance < 0
                    ? "transaction-balance negative-balance"
                    : "transaction-balance";

            const amountClass =
                transaction.amount < 0
                    ? "transaction-amount debit"
                    : "transaction-amount credit";

            row.innerHTML = `
                <div class="transaction-date">
                    ${formatDate(transaction.date)}
                </div>

                <div class="transaction-comment">
                    ${escapeHtml(
                        transaction.comment || ""
                    )}
                </div>

                <div class="${amountClass}">
                    ${formatAmount(transaction.amount)}
                </div>

                <div class="${balanceClass}">
                    ${formatBalance(transaction.balance)}
                </div>
            `;

            list.appendChild(row);
        }

        /*
         * Current balance is the balance
         * after the newest transaction.
         */

        if (sorted.length > 0) {

            const current =
                sorted[0].balance;

            const balanceElement =
                document.getElementById(
                    "currentBalance"
                );

            balanceElement.textContent =
                formatBalance(current);

            if (current < 0) {
                balanceElement.classList.add(
                    "negative"
                );
            } else {
                balanceElement.classList.remove(
                    "negative"
                );
            }
        }

    }


    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    /* =========================
       ADD TRANSACTION
       ========================= */

    function openAddTransaction() {

        const modal =
            document.getElementById(
                "transactionModal"
            );

        const date =
            document.getElementById(
                "dateInput"
            );

        const amount =
            document.getElementById(
                "amountInput"
            );

        const today =
            new Date()
                .toISOString()
                .split("T")[0];

        date.value = today;

        amount.value = "";

        document.getElementById(
            "categoryInput"
        ).value = "";

        document.getElementById(
            "commentInput"
        ).value = "";

        updateSaveButton();

        modal.classList.add("open");

        /*
         * Amount is the field we expect
         * to be entered most often.
         */

        setTimeout(() => {
            amount.focus();
        }, 150);

    }


    function closeAddTransaction() {

        document
            .getElementById("transactionModal")
            .classList.remove("open");

    }


    function chooseCategory(value) {

        document.getElementById(
            "categoryInput"
        ).value = value;

    }


    function chooseComment(value) {

        document.getElementById(
            "commentInput"
        ).value = value;

    }


    function updateSaveButton() {

        const amount =
            document.getElementById(
                "amountInput"
            ).value.trim();

        const saveButton =
            document.getElementById(
                "saveButton"
            );

        saveButton.disabled =
            amount === "" ||
            amount === "+" ||
            amount === "-";

    }


    function addTransaction() {

        const date =
            document.getElementById(
                "dateInput"
            ).value;

        let amountText =
            document.getElementById(
                "amountInput"
            ).value
            .trim()
            .replace(/,/g, "");


        const category =
            document.getElementById(
                "categoryInput"
            ).value
            .trim();

        const comment =
            document.getElementById(
                "commentInput"
            ).value
            .trim();


        if (!date) {
            return;
        }


        /*
         * Convert the typed amount to a number.
         */

        const amount =
            Number(amountText);


        if (!Number.isFinite(amount) ||
            amount === 0) {

            return;

        }


        transactions.push({

            date: date,

            amount: amount,

            category: category,

            comment: comment

        });


        renderTransactions();

        closeAddTransaction();

    }


    /* =========================
       THEME
       ========================= */

    function toggleThemeMenu() {

        const menu =
            document.getElementById(
                "themeMenu"
            );

        menu.style.display =
            menu.style.display === "block"
                ? "none"
                : "block";

    }


    function setTheme(theme) {

        if (theme === "light") {

            document.body.classList.add(
                "light"
            );

            localStorage.setItem(
                "cashFlowTheme",
                "light"
            );

        } else {

            document.body.classList.remove(
                "light"
            );

            localStorage.setItem(
                "cashFlowTheme",
                "dark"
            );

        }

        document.getElementById(
            "themeMenu"
        ).style.display = "none";

    }


    /* =========================
       INPUT EVENTS
       ========================= */

    document
        .getElementById("amountInput")
        .addEventListener(
            "input",
            updateSaveButton
        );
